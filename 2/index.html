<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기분날씨</title>
  <meta name="description" content="오늘 기분을 날씨로 남기는 나만의 작은 하늘">
  <meta name="theme-color" content="#5e8fd6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="기분날씨">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/GibunSans-Variable.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/GowunBatang-Bold.woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/forecast.css">
</head>
<body data-ink="white" data-screen="today">
  <div id="device">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="sky-scrim" aria-hidden="true"></div>

    <main id="screens">
      <section id="screen-today" class="screen" role="tabpanel" aria-label="오늘"></section>
      <section id="screen-calendar" class="screen" role="tabpanel" aria-label="달력"></section>
      <section id="screen-forecast" class="screen" role="tabpanel" aria-label="예보"></section>
    </main>

    <nav id="tabbar" role="tablist" aria-label="화면 이동">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="today" aria-controls="screen-today" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <span>오늘</span>
      </button>
      <button class="tab" role="tab" data-tab="calendar" aria-controls="screen-calendar" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="3.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span>달력</span>
      </button>
      <button class="tab" role="tab" data-tab="forecast" aria-controls="screen-forecast" aria-selected="false">
        <span class="tab-badge" id="forecast-badge" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3.5"/><circle cx="12" cy="9.5" r="2.4"/><path d="M8.5 15h7M8.5 17.6h4.5"/></svg>
        <span>예보</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast-root" role="status" aria-live="polite"></div>
    <div id="rotate-hint">휴대폰을 세로로 돌려 주세요</div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
