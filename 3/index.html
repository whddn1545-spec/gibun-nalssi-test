<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1726">
<meta name="color-scheme" content="dark">
<title>기분날씨</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="기분날씨">
<link rel="preload" href="fonts/GowunBatang-Bold-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Pretendard-Regular-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="backdrop" aria-hidden="true"><div class="bd" id="bdA"></div><div class="bd" id="bdB"></div></div>
<div id="app" class="booting">
  <canvas id="sky"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <main id="screen-today" class="screen" data-screen="today">
    <div class="top" id="top">
      <h1 class="place t" id="place"></h1>
      <p class="when t" id="when"></p>
      <div class="hero t" id="hero"></div>
      <h2 class="wname t" id="wname"></h2>
      <p class="line t" id="line"></p>
      <p class="memo-view t" id="memoView"></p>
    </div>
    <button class="icon-btn settings-btn press" id="settingsBtn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21.2V8.2"/><path d="M8.6 21.2h6.8"/><path d="M4.6 8.2h12.6"/><path d="M14.6 5.6l3 2.6-3 2.6"/><path d="M4.6 8.2 3.2 5.9M4.6 8.2l-1.4 2.3"/><path d="M9.4 13.6h5.2"/><circle cx="12" cy="4.2" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="edit-btn press" id="editBtn" type="button"></button>
    <button class="friend-hit" id="friendHit" type="button"></button>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="bottom" id="bottom">
      <p class="hint t" id="hint"></p>
      <div class="picker" id="picker" role="radiogroup"></div>
      <div class="memo-row" id="memoRow">
        <div class="memo-field">
          <input id="memo" type="text" maxlength="50" autocomplete="off" enterkeyhint="done" spellcheck="false">
          <span class="memo-count" id="memoCount" aria-hidden="true"></span>
        </div>
        <button class="save-btn press" id="saveBtn" type="button"></button>
      </div>
      <div class="info-row t" id="infoRow"><span id="lookback"></span><span class="count-view" id="countView"></span></div>
      <ol class="week" id="week"></ol>
    </div>
  </main>

  <section id="screen-calendar" class="screen board-screen" data-screen="calendar" hidden>
    <div class="wash"></div><div class="inner"></div>
  </section>
  <section id="screen-forecast" class="screen board-screen" data-screen="forecast" hidden>
    <div class="wash"></div>
    <div class="inner"><h2 class="board-title" id="fcTitle"></h2>
      <div class="fc-empty" id="fcEmpty"><p class="cal-empty-t" id="fcEmptyT"></p><p class="cal-empty-b" id="fcEmptyB"></p><button class="pill-btn" id="fcSample" type="button"></button></div>
    </div>
  </section>
  <section id="screen-settings" class="screen board-screen" data-screen="settings" hidden>
    <div class="wash"></div>
    <div class="inner"><h2 class="board-title" id="setTitle"></h2>
      <button class="icon-btn back-btn press" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
      <button class="set-row" id="setSample" type="button"><span class="set-row-t" id="setSampleT"></span><span class="set-row-d" id="setSampleD"></span></button>
    </div>
  </section>
  <div class="sample-banner" id="sampleBanner" hidden><span id="sampleText"></span><button type="button" id="sampleExit"></button></div>

  <nav class="tabs" id="tabs">
    <button class="tab press" type="button" data-tab="today">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <defs><clipPath id="tabSunClip"><path d="M0 0H24V17.9L22 17.9C19.5 15.2 16 12.9 12.6 12C9 11 5 12.9 2 17.9L0 17.9Z"/></clipPath></defs>
        <g class="ln" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.6" cy="12.2" r="3.1" fill="currentColor" stroke="none" clip-path="url(#tabSunClip)"/><path d="M2 19.5C5 14.5 9 12.6 12.6 13.6C16 14.5 19.5 16.8 22 19.5"/></g>
        <g class="fl" fill="currentColor"><circle cx="16.6" cy="12.6" r="4.3" clip-path="url(#tabSunClip)"/><path d="M1.4 19.8C4.6 14.2 8.8 12.1 12.6 13.1C16.2 14 19.8 16.5 22.6 19.8V20.8H1.4z"/></g>
      </svg><span></span>
    </button>
    <button class="tab press" type="button" data-tab="calendar">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <g class="ln" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="7.6" cy="7.6" r="3.4"/><circle cx="16.4" cy="7.6" r="3.4"/><circle cx="7.6" cy="16.4" r="3.4"/><circle cx="16.4" cy="16.4" r="3.4"/></g>
        <g class="fl" fill="currentColor"><circle cx="7.6" cy="7.6" r="4.2"/><circle cx="16.4" cy="7.6" r="4.2"/><circle cx="7.6" cy="16.4" r="4.2"/><circle cx="16.4" cy="16.4" r="4.2"/></g>
      </svg><span></span>
    </button>
    <button class="tab press" type="button" data-tab="forecast">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <g class="ln" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.4h8.4l4 4v13.2H6z"/><path d="M14.4 3.4v4h4"/><path d="M9 12.2h6M9 15.8h4.4"/></g>
        <g class="fl" fill="currentColor" fill-rule="evenodd"><path d="M5.2 2.6h9.6l4.8 4.8v14H5.2zM9 11.3h6v1.7H9zM9 14.9h4.4v1.7H9z"/></g>
      </svg><span></span>
    </button>
  </nav>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
